# 放心借 lookalike：LightGBM + PU（正类=低定价种子，未标注=背景扩量人群）

data:
  input_path: data/training_pu.parquet
  # 同事筛选 4443 列白名单；仅加载/入模这些列，其余宽表字段丢弃
  feature_list_path: features/colleague_selected_features.txt
  id_col: unique_id
  label_col: pu_label          # 1=种子(Positive)，0=未标注(Unlabeled)
  split_col: dataset_split
  train_split_value: train
  val_split_value: val
  filter:
    require_zx_report: true    # zx_has_report_flg == 1
    zx_report_col: zx_has_report_flg
    # 背景人群 ms13 下限（Notion：可剔 630 以下）；仅对 pu_label=0 生效，0 表示不筛
    unlabeled_ms13_min: 0
    ms13_col: ms13_score       # 若宽表列名不同请在 SQL 导出层对齐

pu:
  method: elkanoto             # elkanoto | weighted_naive
  hold_out_ratio: 0.1          # Elkanoto：从未标注集中留作 hold-out
  unlabeled_weight: 0.05       # weighted_naive：未标注样本权重（<<1）

training:
  random_seed: 42
  num_boost_round: 800
  early_stopping_rounds: 80
  # 未标注过多时，训练可对 U 下采样以控制内存（1.0=全量）
  unlabeled_subsample_ratio: 0.2
  params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    learning_rate: 0.05
    num_leaves: 63
    max_depth: 8
    min_data_in_leaf: 200
    feature_fraction: 0.7
    bagging_fraction: 0.7
    bagging_freq: 1
    lambda_l2: 2.0
    verbosity: -1
    seed: 42

output:
  artifacts_dir: artifacts
  model_name: lgbm_fxj_lookalike_pu
