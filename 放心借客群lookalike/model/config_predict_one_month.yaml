# 同事七月真实用户特征表：仅打分 + 分布统计（无 ground truth，label 全为 -1）
#
# 数据默认路径（分析机）：
#   data/predict_one_month.parquet
# 或绝对路径：
#   /home/finance/IDE/work/user_data/jiangchengrun/fxj_lookalike/model/data/predict_one_month.parquet
#
# 示例（train_window 全量特征模型）：
#   python scripts/score_distribution.py \
#     --config config_predict_one_month.yaml \
#     --model artifacts/lgbm_fxj_lookalike_pu_train_window_*.txt \
#     --chunk-size 30000 \
#     --out-dir artifacts/predict_one_month_train_window
#
# TGI 召回后模型：换 --config config_train_tgi_recall.yaml 与对应 model 路径
#
# 多分片（part1~5）一键打分 + 合并：
#   python scripts/batch_predict_merge.py \
#     --config config_predict_one_month.yaml \
#     --data-template /home/finance/IDE/work/user_data/jiangchengrun/fxj_lookalike/model/data/predict_one_month_part{part}.parquet \
#     --parts 1 2 3 4 5 \
#     --model artifacts/lgbm_fxj_lookalike_pu_train_window_*.txt \
#     --out-dir artifacts/predict_one_month_scores \
#     --chunk-size 30000

data:
  input_path: data/predict_one_month.parquet
  feature_list_path: features/colleague_selected_features.txt
  id_col: unique_id
  label_col: label
  split_col: dataset_split
  train_split_value: train
  val_split_value: val
  filter:
    require_zx_report: true
    zx_report_col: zx_has_report_flg
    unlabeled_ms13_min: 0
    ms13_col: ms13_score
