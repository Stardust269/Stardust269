# 时间切分训练配置（train 窗 9:1 + tgi test 评估）

data:
  input_path: data/training_pu_train_window.parquet
  feature_list_path: features/colleague_selected_features.txt
  id_col: unique_id
  label_col: pu_label
  split_col: dataset_split
  train_split_value: train
  val_split_value: val
  filter:
    require_zx_report: true
    zx_report_col: zx_has_report_flg
    unlabeled_ms13_min: 0
    ms13_col: ms13_score

pu:
  method: weighted_naive
  hold_out_ratio: 0.1
  unlabeled_weight: 0.05

training:
  random_seed: 42
  num_boost_round: 800
  early_stopping_rounds: 80
  unlabeled_subsample_ratio: 1.0   # SQL 已按时间切分；train 窗内不负采样
  memory:
    use_float32: true
    release_dataframes: true
    lgb_free_raw_data: true
    skip_train_metrics: true
    valid_on_val_only: true
    max_bin: 127
  params:
    objective: binary
    metric: auc
    boosting_type: gbdt
    learning_rate: 0.05
    num_leaves: 63
    max_depth: 8
    min_data_in_leaf: 200
    feature_fraction: 0.7
    bagging_fraction: 0.7
    bagging_freq: 1
    lambda_l2: 2.0
    verbosity: -1
    seed: 42
    num_threads: 2

output:
  artifacts_dir: artifacts
  model_name: lgbm_fxj_lookalike_pu_train_window
